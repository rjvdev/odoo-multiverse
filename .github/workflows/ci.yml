name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck --version && shellcheck odoomv

  e2e-run:
    name: e2e (${{ matrix.odoo }})
    needs: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        odoo: ["16", "20"]
    env:
      V: ${{ matrix.odoo }}
    steps:
      - uses: actions/checkout@v7

      - name: Start Odoo ${{ matrix.odoo }}
        run: ./odoomv up "$V"

      - name: Create the odoo${{ matrix.odoo }} database
        run: ./odoomv init "$V"

      - name: Wait for /web/health (up to 120 s)
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "http://127.0.0.1:80$V/web/health"; then
              echo; echo "healthy after $(( (i - 1) * 5 )) s"; exit 0
            fi
            sleep 5
          done
          echo "Odoo $V did not answer on /web/health within 120 s" >&2
          exit 1

      - name: Test lab_selftest
        run: ./odoomv test "$V" lab_selftest

      - name: Status
        if: always()
        run: ./odoomv status

      - name: Odoo logs on failure
        if: failure()
        run: ./odoomv logs "$V"

      - name: Stop the lab
        if: always()
        run: ./odoomv down

  # Required check for branch protection: the matrix reports "e2e (16)" and "e2e (20)",
  # this job reports "e2e" and fails unless every matrix leg succeeded.
  e2e:
    name: e2e
    needs: e2e-run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check the e2e matrix result
        env:
          RESULT: ${{ needs.e2e-run.result }}
        run: |
          echo "e2e matrix result: $RESULT"
          test "$RESULT" = success
